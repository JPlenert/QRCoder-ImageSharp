name: release

# Publishes to nuget.org via Trusted Publishing (OIDC, no stored API key).
# Trigger: push a tag like v0.11.0 that matches <Version> in QRCoder/QRCoder.csproj.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Check tag matches csproj version
        run: |
          CSPROJ_VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' QRCoder/QRCoder.csproj)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CSPROJ_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match csproj version $CSPROJ_VERSION"
            exit 1
          fi

      - run: dotnet test -f net10.0

      - run: dotnet pack QRCoder/QRCoder.csproj -c Release -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release          # must match the nuget.org policy + GitHub environment protection rules
    permissions:
      id-token: write             # only this job may request the OIDC token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}   # nuget.org profile name, not email

      - name: NuGet push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
