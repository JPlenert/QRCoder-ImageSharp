name: release

# Publishes to nuget.org via Trusted Publishing (OIDC, no stored API key).
# Trigger: push a tag like v0.11.0 — the package version is taken from the tag
# (the csproj has no <Version>; local builds default to 1.0.0).

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Get version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a valid version (expected e.g. v1.2.3 or v1.2.3-beta.1)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - run: dotnet test -f net10.0

      # GeneratePackageOnBuild (set in csproj) races with an explicit pack on multi-target builds -> NU5026
      - run: dotnet pack QRCoder/QRCoder.csproj -c Release -o artifacts -p:Version=${{ env.VERSION }} -p:GeneratePackageOnBuild=false

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release          # must match the nuget.org policy + GitHub environment protection rules
    permissions:
      id-token: write             # only this job may request the OIDC token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}   # nuget.org profile name, not email

      - name: NuGet push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
